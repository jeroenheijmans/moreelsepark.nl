<style>
  :root {
    --ink: #15221e;
    --ink-soft: #1f322b;
    --paper: #f7f1e3;
    --paper-ink: #2a2a24;
    --gold: #e2b563;
    --moss: #5f7d68;
    --bar-h: 3.5rem;
    --fade: 1.6s;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--serif);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- A. visual ---------- */
  #pan, #pan > * { position: fixed; inset: 0; }
  #pan {
    will-change: transform, opacity;
    opacity: 0;
    transition: opacity var(--fade) ease-in-out;
    transform-origin: 50% 50%;
  }
  #bg {
    background: center / cover no-repeat var(--ink-soft);
  }
  #gl {
    width: 100%; height: 100%;
    display: none;
  }
  .gl #gl { display: block; }
  #stage.in #pan { opacity: 1; }

  #veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(8, 14, 12, .45) 100%),
      linear-gradient(to top, rgba(8, 14, 12, .45), transparent 35%);
  }

  /* ---------- header & footer ---------- */
  header, footer {
    position: fixed; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(21, 34, 30, .62);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    text-align: center;
  }
  header {
    top: 0;
    height: calc(var(--bar-h) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    border-bottom: 1px solid rgba(226, 181, 99, .22);
  }
  footer {
    bottom: 0;
    height: calc(2.5rem + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    border-top: 1px solid rgba(226, 181, 99, .22);
    font-size: .78rem;
    letter-spacing: .08em;
    color: rgba(247, 241, 227, .72);
  }
  header h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(1.15rem, 1rem + 1vw, 1.6rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    text-indent: .32em; /* balances trailing letter-spacing */
    color: var(--paper);
  }
  header h1 span { color: var(--gold); }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 a:hover, header h1 a:focus-visible { opacity: .85; outline: none; }
  footer small { white-space: nowrap; }
  @media (max-width: 420px) { footer { font-size: .68rem; letter-spacing: .04em; } }
  footer .sep { margin: 0 .35em; opacity: .5; }
  footer a {
    color: inherit; text-decoration: none;
    border-bottom: 1px solid rgba(247, 241, 227, .3);
    transition: color .2s, border-color .2s;
  }
  footer a:hover, footer a:focus-visible { color: var(--gold); border-color: currentColor; outline: none; }

  /* ---------- B. museum plaques ---------- */
  #plates {
    position: fixed; z-index: 5;
    left: clamp(1rem, 4vw, 3rem);
    bottom: calc(2.5rem + env(safe-area-inset-bottom) + clamp(1rem, 4vh, 2.5rem));
    width: min(26rem, calc(100vw - 2rem));
    display: flex; flex-direction: column; gap: .7rem;
    pointer-events: none;
  }
  .plaque {
    position: relative;
    pointer-events: auto;
    padding: 1.4rem 1.6rem 1.3rem;
    background: rgba(247, 241, 227, .55);
    color: var(--paper-ink);
    border-radius: 2px;
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 18px 40px -12px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.25);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.2s ease-in-out, transform 1.6s cubic-bezier(.2,.7,.2,1);
  }
  .plaque::before {
    content: ""; position: absolute; inset: 5px; pointer-events: none;
    border: 1px solid rgba(95, 125, 104, .45);
  }
  #stage.in .plaque { opacity: 1; transform: none; transition-delay: .5s; }
  #stage.in #photo-plate { transition-delay: .8s; }

  /* decorative label on the fact plaque */
  #fact-plate .kicker {
    display: flex; align-items: center; gap: .55rem;
    margin: 0 0 1rem;
    font-size: .88rem; line-height: 1.4; font-style: italic; white-space: nowrap;   /* same as the photo plaque */
    color: var(--paper-ink);
    opacity: 0.7;
  }
  #fact-plate .kicker::after {
    content: ""; flex: 1; min-width: .8rem; height: 1px;
    background: linear-gradient(to right, rgba(201, 150, 60, .75), transparent);
  }

  #fact-plate { padding-top: 1.05rem; }
  #fact-plate h2 {
    margin: 0 0 .55rem;
    font-size: 1.35rem; font-weight: 700; letter-spacing: .02em;
    color: var(--ink);
  }
  #fact-plate h2::after {
    content: ""; display: block; width: 2.2rem; height: 2px; margin-top: .55rem;
    background: var(--gold);
  }
  #fact-plate p { margin: 0; font-size: 1.02rem; line-height: 1.55; }
  #fact-plate a {
    display: inline-block; margin-top: .8rem;
    font-size: .8rem; letter-spacing: .12em; text-transform: uppercase;
    color: #1f3a2c; font-weight: 700; text-decoration: none;
    border-bottom: 1px solid rgba(31, 58, 44, .55);
    transition: color .2s, border-color .2s;
  }
  #fact-plate a:hover, #fact-plate a:focus-visible { color: #8a5d10; border-color: currentColor; outline: none; }
  #fact-plate a::after { content: " ↗"; }

  /* smaller photo caption plaque, above the fact plaque */
  #photo-plate { padding: .6rem 1.1rem .62rem; }
  #photo-plate::before { inset: 4px; }
  #photo-plate p { margin: 0; font-size: .88rem; line-height: 1.4; font-style: italic; }

  @media (max-width: 600px) {
    #plates { left: 1rem; right: 1rem; width: auto; }
    #fact-plate { padding: .9rem 1.25rem 1.05rem; }
    #fact-plate h2 { font-size: 1.2rem; }
    #fact-plate p { font-size: .96rem; }
    #photo-plate { padding: .5rem .9rem .52rem; }
    #photo-plate p, #fact-plate .kicker { font-size: .82rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --fade: .01s; }
    .plaque { transition-duration: .01s; }
  }

<body>
<header><h1><a href="./" aria-label="Moreelsepark.nl – naar de startpagina">Moreelse<span>park</span>.nl</a></h1></header>

<main id="stage">
  <div id="pan">

      <h2 id="plate-title"></h2>

      <a id="plate-link" target="_blank" rel="noopener"></a>
    </article>
  </div>
</main>

<footer><small>© <span id="year">2026</span> Moreelsepark.nl <span class="sep">|</span> <a href="https://github.com/jeroenheijmans/moreelsepark.nl" target="_blank" rel="noopener">Source on GitHub</a> <span class="sep">|</span> V1.0.1</small></footer>

<script>
(() => {
  'use strict';

  /* ============ SETTINGS (tweak me) ============ */
  const SLIDE_MS = 15000;   // ms per slide, e.g. 10000..40000
  const FADE_MS = 1700;     // ms of fade out/in between slides, e.g. 500..3000

  // Painting effect (WebGL). Reload the page to see changes.
  const PAINT = {
    revealStart:    0.15,   // 0..0.5    head start of the paint (higher = paint begins sooner)
    revealSpeed:    1.8,    // 1..3      how fast the paint spreads (higher = faster; ~1.3 is slow, 2.5 is fast)
    paintDoneAt:    0.8,    // 0.3..1    fraction of the slide after which the painting is complete and just holds
    revealSoftness: 0.2,    // 0.05..0.5  how gradually paint creeps in (low = crisp front, high = diffuse)
    wobble:         0.010,  // 0..0.03    wet-paper distortion of the brush position (0 = none)
    strokeLength:   2.1,    // 0.5..3     length of the brush strokes (higher = longer, smoother smears)
    washMix:        0.6,    // 0..1       how much colour bleeds softly beyond the strokes
    posterize:      0.3,    // 0..1       strength of flat pigment layers (0 = smooth, 1 = hard bands)
    posterizeLevels: 8,     // 2..12      number of tone levels per channel (fewer = more graphic)
    saturation:     1.4,    // 0.6..1.8   pigment saturation (1 = same as photo)
    paperLift:      0.12,   // 0..0.5     lighten towards paper white (watery, airy look)
    blooms:         0.1,    // 0..0.5     dark-rimmed 'cauliflower' blooms (0 = none)
    edgeDarkening:  0.3,    // 0..1       pigment pooling at shape borders
    bristles:       0.05,   // 0..0.3     faint brush-hair streaks along the strokes
    granulation:    0.04,   // 0..0.3     pigment settling in paper grooves (more in dark tones)
    paperTexture:   0.03,   // 0..0.15    visible paper fibres / grain
    wetEdge:        0.12,   // 0..0.4     darker rim at the advancing front of the paint
    pencil:         0.5     // 0..1       hand-drawn graphite outline strength (0 = off)
  };
  /* ============================================== */
  const F = n => Number.isInteger(n) ? n.toFixed(1) : String(n);   // JS number -> GLSL float literal

  // Photos in assets/<file>.jpg; the caption is shown as 'Foto: <caption>'.
  const IMAGES = [
    { file: '2018-06-a', caption: 'Uitzicht vanaf Moreelsepark op de Inktpot.' },
    { file: '2022-09-a', caption: 'De Inktpot vanaf de ingang, begin van de avond.' },
    { file: '2023-10-a', caption: 'Uitzicht vanaf Moreelsepark tussen de Dom en de Inktpot door.' },
    { file: '2024-01-a', caption: 'Winters uitzicht vanaf Moreelsepark richting Dom en Inktpot.' },
    { file: '2024-04-a', caption: 'Recente verbouwing plint van Moreelsepark gebouwen.' },
    { file: '2024-04-b', caption: 'Regenboog achter de Inktpot.' },
    { file: '2024-07-a', caption: 'Uitzicht vanaf Bollendank Stationsplein, richting Moreelsepark.' },
    { file: '2024-08-a', caption: 'Uitzicht op de Catharijnesingel.' },
    { file: '2024-08-b', caption: 'Uitzicht vanaf Moreelsepark op Inktpot en IK gebouw.' },
    { file: '2024-09-a', caption: 'Uitzicht vanaf Moreelsepark richting de Dom, zonsopkomst.' },
    { file: '2025-05-a', caption: 'Maan boven de Inktpot, gezien vanaf Moreelsepark.' },
    { file: '2025-08-a', caption: 'Regenboog boven binnenstad van Utrecht, gezien vanaf Moreelsepark.' },
    { file: '2025-11-a', caption: 'Uitzicht Moreelsepark op avondwerk in de Rabobank toren.' },
    { file: '2025-11-b', caption: 'Uitzicht vanaf Moreelsepark richting Moreelsebrug en Rabobank toren.' },
    { file: '2025-11-c', caption: 'Uitzicht vanaf Moreelsepark richting Inktpot en binnestad, bij zonsopkomst.' },
    { file: '2026-01-a', caption: 'Besneeuwd uitzicht richting Oudegracht, vanaf Moreelsepark.' },
    { file: '2026-06-a', caption: 'Donkere wolken boven de Inktpot, vanaf Moreelsepark gezien.' },
    { file: '2026-06-b', caption: 'Volle maan naast de Inktpot, gezien vanaf Moreelsepark.' },
    { file: '2026-07-a', caption: 'Domtoren gezien vanaf Moreelsepark, ochtendrood vroeg op een zomermorgen.' },
    { file: '2026-07-b', caption: 'Catharijnesingel en Hoog Catharijne.' },
    { file: '2026-08-a', caption: 'Uitzicht bovenop Hoog Catharijne, vanaf Moreelsepark.' },
    { file: '2026-08-b', caption: 'Uitzicht op gebouwen aan Catharijnesingel, vanaf Moreelsepark.' },
    { file: '2026-08-c', caption: 'Uitzicht van boven naar beneden, langs de noodtrappen bij Moreelsepark.' },
    { file: '2026-08-d', caption: 'Uitzicht op binnenzijde appartementen bij Moreelsepark.' },
    { file: '2026-08-e', caption: 'Uitzicht vanaf Moreelsepark op nieuwe flats rondom Utrecht CS.' },
    { file: '2026-09-a', caption: 'Uitzicht op Inktpot en IK gebouw, avondrood.' },
    { file: '2026-09-b', caption: 'NS kantoor gezien vanaf Moreelsepark, in avondrood.' },
    { file: '2026-09-c', caption: 'Uitzicht op Bollendak bij Stationsplein, vanaf Moreelsepark.' }
  ].map(i => ({ id: i.file, src: `assets/${i.file}.jpg`, caption: i.caption }));

  const QUOTES = [
    { title: 'Hendrick Moreelse', text: 'Utrechtse burgemeester, hoogleraar, raadsheer, en bedenker van een nooit uitgevoerd uitbreidingsplan voor de stad Utrecht.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/Hendrick_Moreelse' } },
    { title: 'De Parade', text: 'Jaarlijks festival op het Moreelsepark, met theater-, dans-, mime- en muziekvoorstellingen voor jong en oud.', link: { label: 'DeParade.nl', href: 'https://deparade.nl' } },
    { title: 'Moreelsepark', text: 'Naam van zowel het park als de straat in de binnenstad van Utrecht.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/Moreelsepark' } },
    { title: 'Moreelsebrug', text: 'Deze voetgangers- en fietsbrug van ongeveer 295 meter lang loopt over de sporen van Utrecht Centraal en verbindt het Beurskwartier met de binnenstad. Ze werd in 2016 geopend.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/Moreelsebrug' } },
    { title: 'De Inktpot', text: 'Het grootste bakstenen gebouw van Nederland, ontworpen door George van Heukelom en gebouwd tussen 1918 en 1921 voor de Nederlandse Spoorwegen. Nu is het het hoofdkantoor van ProRail.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/De_Inktpot' } },
    { title: 'Hoog Catharijne', text: 'Dit winkelcentrum ligt tussen de oude binnenstad en Centraal Station en telt meer dan 120 winkels en 30 restaurants. Sinds 2020 kun je er met een boot onderdoor varen.', link: { label: 'Hoog Catharijne', href: 'https://hoog-catharijne.klepierre.nl/winkelcentrum' } },
    { title: 'Utrecht Centraal', text: 'Het drukste station van Nederland, met acht perrons en jaarlijks naar schatting 57 miljoen reizigers. Het huidige stationsgebouw werd op 7 december 2016 geopend.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/Station_Utrecht_Centraal' } },
    { title: 'Catharijnesingel', text: 'Dit deel van de gracht werd in de jaren zeventig gedempt voor een weg en Hoog Catharijne. Sinds 2020 is de singel hersteld en stroomt er weer water.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/Catharijnesingel' } },
    { title: 'Utrecht', text: 'Utrecht is de hoofdstad van de gelijknamige provincie en ontstond als Romeinse versterking. De stad kreeg in 1122 stadsrechten; de Domtoren is het symbool van de stad.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/Utrecht_(stad)' } },
    { title: 'Spoorwegmonument', text: 'Dit oorlogsmonument herdenkt spoorwegpersoneel dat in de Tweede Wereldoorlog omkwam. Beeldhouwer Willem Valk maakte het; het werd in 1949 onthuld en noemt 499 namen.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/Monument_voor_het_gevallen_spoorwegpersoneel' } },
    { title: 'Sneltram', text: 'De sneltram verbindt Utrecht Centraal sinds 1983 met de Uithof en met Nieuwegein en IJsselstein. Het net heeft drie lijnen en is ongeveer 18 kilometer lang.', link: { label: 'Wikipedia', href: 'https://en.wikipedia.org/wiki/Utrechtse_sneltram' } },
    { title: 'Catharijneconvent', text: 'Dit was een klooster van de johannieters, verbonden met een gasthuis voor ziekenzorg. Het gebouw is nu in gebruik als Museum Catharijneconvent, dat er sinds 1979 gevestigd is.', link: { label: 'Wikipedia', href: 'https://nl.wikipedia.org/wiki/Catharijneconvent_(klooster)' } },
    { title: 'Tuinen van Moreelse', text: 'De gemeente wil het Moreelsepark groener maken, met meer plekken om te verblijven. Een schetsontwerp staat gepland voor 2026 en de werkzaamheden starten naar verwachting in 2028.', link: { label: 'Gemeente Utrecht', href: 'https://www.utrecht.nl/wonen-en-leven/parken-en-groen/parken-en-plantsoenen/tuinen-van-moreelse-opnieuw-inrichten' } }
  ];

  const $ = id => document.getElementById(id);
  const stage = $('stage'), pan = $('pan'), bg = $('bg'), canvas = $('gl');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);

  $('year').textContent = new Date().getFullYear();

  /* ---------- helpers ---------- */
  let lastImg = -1, lastQuote = -1;
  function pickDifferent(n, last) {
    if (n < 2) return 0;
    let i; do { i = Math.floor(Math.random() * n); } while (i === last);
    return i;
  }
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('load ' + src));
      img.src = src;
    });
  }
  // Photos come from a shuffled deck, so every photo shows once before any repeats.
  let deck = [];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function nextFromDeck() {
    if (!deck.length) {
      deck = shuffle(IMAGES.map((_, i) => i));
      const top = deck.length - 1;
      if (deck.length > 1 && deck[top] === lastImg) [deck[top], deck[0]] = [deck[0], deck[top]];   // no repeat across the seam
    }
    return deck.pop();
  }

  // Prepares a slide: the requested photo id if it exists (and loads), otherwise a random photo.
  async function prepareNext(wantedId) {
    let want = IMAGES.findIndex(i => i.id === wantedId);
    for (let tries = 0; tries < 6; tries++) {
      const i = want >= 0 ? want : nextFromDeck();
      want = -1;                                    // a requested photo gets one try only
      lastImg = i;
      try {
        const img = await loadImage(IMAGES[i].src);
        const q = pickDifferent(QUOTES.length, lastQuote);
        lastQuote = q;
        return { id: IMAGES[i].id, img, quote: QUOTES[q], caption: IMAGES[i].caption };
      } catch (e) { /* try another one */ }
    }
    return null;
  }

  /* ---------- URL <-> photo (#2026-08-b) ---------- */
  const hashId = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } };
  const isPhotoId = id => IMAGES.some(i => i.id === id);
  // mode: 'push' | 'replace' | 'none' (URL already right). The title is set right AFTER the history
  // call, in the same tick: that way the new entry is recorded with the new title, while the entry
  // we are leaving keeps its own (setting the title before pushState would rename the old entry).
  function setUrl(id, mode) {
    if (mode !== 'none') {
      try {
        const url = location.pathname + location.search + '#' + encodeURIComponent(id);
        if (mode === 'push') history.pushState(null, '', url); else history.replaceState(null, '', url);
      } catch (e) { /* e.g. restricted origins: URL sync is optional */ }
    }
    document.title = `Moreelsepark.nl – ${id}`;
  }

  /* ---------- WebGL watercolor ---------- */
  const VERT = `
    attribute vec2 aPos; varying vec2 vUv;
    void main(){ vUv = aPos * .5 + .5; gl_Position = vec4(aPos, 0., 1.); }`;

  const FRAG = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform vec2  uScale;   // cover-fit: visible part of the image in uv
    uniform float uStep;    // brush radius in image-uv units
    uniform float uP;       // 0..1 progress of the painting
    uniform float uSeed;
    uniform vec2  uRes;

    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
    }
    float fbm(vec2 p){
      float a = .5, s = 0.;
      for (int i = 0; i < 4; i++){ s += a * vnoise(p); p = p * 2.03 + 11.7; a *= .5; }
      return s;
    }
    vec3 tex(vec2 uv){ return texture2D(uTex, vec2(clamp(uv.x,0.,1.), 1. - clamp(uv.y,0.,1.))).rgb; }
    float lum(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
    // structure tensor contribution of one 2x2 cell: (gx*gx, gy*gy, gx*gy)
    vec3 cell(float p00, float p10, float p01, float p11){
      float gx = (p10 + p11 - p00 - p01) * .5, gy = (p01 + p11 - p00 - p10) * .5;
      return vec3(gx*gx, gy*gy, gx*gy);
    }

    void main(){
      vec2 uv = (vUv - .5) * uScale + .5;
      vec3 photo = tex(uv);
      if (uP < .001){ gl_FragColor = vec4(photo, 1.); return; }

      // ---- where the paint has arrived (organic front, wider = gentler) ----
      float n = fbm(uv * 3. + uSeed);
      float t = uP * ${F(PAINT.revealSpeed)} - ${F(PAINT.revealStart)};
      float m = smoothstep(n - ${F(PAINT.revealSoftness)}, n + ${F(PAINT.revealSoftness)}, t);
      if (m < .002){ gl_FragColor = vec4(photo, 1.); return; }

      // wobbly "wet paper" distortion of where the brush lands
      vec2 warp = (vec2(fbm(uv * 7. + uSeed), fbm(uv * 7. + 31.4 + uSeed)) - .5) * ${F(PAINT.wobble)};
      vec2 puv = uv + warp;
      vec2 s = vec2(uStep) * vec2(1., uRes.x / uRes.y * uScale.y / uScale.x);
      vec2 px = gl_FragCoord.xy;

      // ---- structure tensor from a 3x3 grid (spacing ~5px) ----
      float d = 2.4;
      float la = lum(tex(puv + s * d * vec2(-1.,-1.))), lb = lum(tex(puv + s * d * vec2(0.,-1.))), lc = lum(tex(puv + s * d * vec2(1.,-1.)));
      float ld = lum(tex(puv + s * d * vec2(-1., 0.))), le = lum(tex(puv)),                         lf = lum(tex(puv + s * d * vec2(1., 0.)));
      float lg = lum(tex(puv + s * d * vec2(-1., 1.))), lh = lum(tex(puv + s * d * vec2(0., 1.))),  li = lum(tex(puv + s * d * vec2(1., 1.)));
      vec3 J = (cell(la,lb,ld,le) + cell(lb,lc,le,lf) + cell(ld,le,lg,lh) + cell(le,lf,lh,li)) * .25;
      float trace = J.x + J.y;
      float edge = smoothstep(.015, .11, sqrt(trace));

      // stroke direction: along edges where structure exists, meandering noise elsewhere
      float na = (fbm(uv * 1.7 + uSeed * 1.7) - .5) * 8.;
      vec2 dd = vec2(J.x - J.y, 2. * J.z);
      vec2 v = mix(vec2(cos(2.*na), sin(2.*na)), dd / (length(dd) + 1e-6), smoothstep(.0008, .012, trace));
      float th = .5 * atan(v.y, v.x);
      vec2 tg = vec2(-sin(th), cos(th));

      // ---- oil/gouache style strokes: edge-aware smoothing along the flow ----
      vec3 cc = tex(puv);
      vec3 acc = cc;
      float wsumf = 1.;
      float lenS = ${F(PAINT.strokeLength)} * mix(.4, 1., m);
      for (int k = -6; k <= 6; k++){
        if (k == 0) continue;
        float fk = float(k);
        vec3 c = tex(puv + tg * fk * lenS * s);
        vec3 dc = c - cc;
        float w = exp(-fk * fk * .045) * exp(-dot(dc, dc) * 14.);
        acc += c * w; wsumf += w;
      }
      vec3 stroke = acc / wsumf;

      // soft wash: wide low-frequency colour that bleeds beyond the strokes
      vec3 w1 = tex(puv + s * vec2(6., 4.)), w2 = tex(puv + s * vec2(-5., 6.)), w3 = tex(puv + s * vec2(-6., -5.)), w4 = tex(puv + s * vec2(5., -6.));
      vec3 d1 = w1 - cc, d2 = w2 - cc, d3 = w3 - cc, d4 = w4 - cc;
      float k1 = exp(-dot(d1,d1) * 12.), k2 = exp(-dot(d2,d2) * 12.), k3 = exp(-dot(d3,d3) * 12.), k4 = exp(-dot(d4,d4) * 12.);
      vec3 wash = (w1*k1 + w2*k2 + w3*k3 + w4*k4 + stroke * 1.5) / (k1 + k2 + k3 + k4 + 1.5);
      vec3 c = mix(stroke, wash, ${F(PAINT.washMix)});

      // pigment layers (soft posterize)
      float L = ${F(PAINT.posterizeLevels)};
      c = mix(c, floor(c * L + .5) / L, ${F(PAINT.posterize)});

      // watercolor tones: a bit more saturated pigment, lifted, paper-white highlights
      float g = lum(c);
      c = clamp(mix(vec3(g), c, ${F(PAINT.saturation)}), 0., 1.);
      c = mix(pow(c, vec3(.9)), vec3(1.), ${F(PAINT.paperLift)});
      vec3 paperCol = vec3(.97, .95, .90);
      c = mix(c, paperCol, smoothstep(.72, .96, g) * .5);

      // blotchy pigment density + blooms (lighter cauliflower patches with a dark rim)
      float blot = fbm(uv * 4.5 + uSeed * 2.3);
      c *= .9 + .2 * blot;
      float bl = fbm(uv * 2.2 + uSeed * 3.1 + 7.);
      float rim = 1. - smoothstep(0., .022, abs(bl - .52));
      c = mix(c, c * c, rim * ${F(PAINT.blooms)});
      c = mix(c, paperCol, smoothstep(.52, .62, bl) * .10);

      // edge darkening: pigment pools at the borders of shapes
      c = mix(c, c * c, edge * ${F(PAINT.edgeDarkening)});

      // bristle streaks along the stroke direction
      vec2 q = vec2(dot(px, tg), dot(px, vec2(-tg.y, tg.x))) * vec2(.045, .6);
      float streak = .5 * (vnoise(q) + vnoise(-q)) - .5;
      c *= 1. + streak * ${F(PAINT.bristles)} * (1. - edge);

      // granulation: pigment settles in paper grooves, mostly in darker tones
      float grain = hash(px) - .5;
      float gran = vnoise(px * .55) - .5;
      c *= 1. + (gran * ${F(PAINT.granulation)} + grain * ${F(PAINT.granulation * 0.4)}) * (1.2 - g);

      // paper: fibres + relief shading
      float fibre = vnoise(px * vec2(.9, .25)) * .5 + vnoise(px * vec2(.3, .8)) * .5;
      float relief = vnoise(px * .7 + vec2(.8, .6)) - vnoise(px * .7 - vec2(.8, .6));
      float paper = ${F(1 - PAINT.paperTexture * 1.2)} + ${F(PAINT.paperTexture)} * fibre + relief * ${F(PAINT.paperTexture * 0.7)};
      c = mix(c * paper, paperCol * paper, .05);

      // darker wet edge at the advancing front
      float ring = smoothstep(0., .5, m) * (1. - smoothstep(.5, 1., m));
      c *= 1. - ring * ${F(PAINT.wetEdge)};

      // hand-drawn pencil outline, broken and wobbly, appears before the colour
      float e2 = 1.1;
      float px1 = lum(tex(puv + vec2(s.x * e2, 0.))) - lum(tex(puv - vec2(s.x * e2, 0.)));
      float py1 = lum(tex(puv + vec2(0., s.y * e2))) - lum(tex(puv - vec2(0., s.y * e2)));
      float pen = smoothstep(.05, .2, length(vec2(px1, py1)));
      float broken = smoothstep(.3, .6, fbm(uv * 38. + uSeed));
      pen *= broken * (.75 + .25 * hash(px * .5));
      vec3 graphite = vec3(.17, .16, .2);

      float mc = smoothstep(.12, .95, m);       // colour arrives slightly after the line
      float mp = smoothstep(0., .5, m);
      vec3 outc = mix(photo, c, mc);
      outc = mix(outc, graphite, pen * ${F(PAINT.pencil)} * mp);
      gl_FragColor = vec4(outc, 1.);
    }`;

  let gl = null, prog = null, loc = {}, tex = null, glState = { scale: [1, 1], step: .004, seed: 0, img: null };
  let slideStart = 0, running = false, lastDraw = 0;

  function initGL() {
    if (reduceMotion) return false;
    try {
      gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
      if (!gl) return false;
      const sh = (type, src) => {
        const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const a = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(a);
      gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
      ['uTex','uScale','uStep','uP','uSeed','uRes'].forEach(n => loc[n] = gl.getUniformLocation(prog, n));
      gl.uniform1i(loc.uTex, 0);
      canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); disableGL(); });
      document.documentElement.classList.add('gl');
      return true;
    } catch (err) {
      console.warn('WebGL effect disabled:', err);
      gl = null;
      return false;
    }
  }
  function disableGL() {
    running = false; gl = null;
    document.documentElement.classList.remove('gl');
  }

  function layoutGL() {
    if (!gl) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    let w = innerWidth * dpr, h = innerHeight * dpr;
    const k = Math.min(1, Math.sqrt(2.4e6 / (w * h)));   // cap pixel count for weak GPUs
    w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    const img = glState.img;
    if (!img) return;
    const va = w / h, ia = img.naturalWidth / img.naturalHeight;
    glState.scale = va > ia ? [1, ia / va] : [va / ia, 1];
    // brush radius ≈ 2.2 device pixels, expressed in image-uv
    glState.step = 2.2 * glState.scale[0] / w;
    gl.uniform2f(loc.uScale, glState.scale[0], glState.scale[1]);
    gl.uniform1f(loc.uStep, glState.step);
    gl.uniform2f(loc.uRes, w, h);
  }

  function uploadTexture(img) {
    glState.img = img;
    if (tex) gl.deleteTexture(tex);
    tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    glState.seed = Math.random() * 50;
    gl.uniform1f(loc.uSeed, glState.seed);
    layoutGL();
  }

  function frame(now) {
    if (!running || !gl) return;
    requestAnimationFrame(frame);
    if (now - lastDraw < 33) return;               // ~30 fps is plenty for a slow wash
    lastDraw = now;
    const p = Math.min(1, (performance.now() - slideStart) / (SLIDE_MS * PAINT.paintDoneAt));
    gl.uniform1f(loc.uP, p);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  /* ---------- slow drifting pan/zoom ---------- */
  let panAnim = null;
  function startPan() {
    if (reduceMotion || !pan.animate) return;
    if (panAnim) panAnim.cancel();
    const z0 = rand(1.15, 1.17), z1 = z0 + rand(.04, .07);   // extra zoom keeps the edges covered
    const lim = 6.4;                                           // % – safely under (z-1)/2
    const a = [rand(-lim, lim), rand(-lim, lim)];
    let b;
    do { b = [rand(-lim, lim), rand(-lim, lim)]; } while (Math.hypot(a[0]-b[0], a[1]-b[1]) < 5);
    const t = (p, z) => `translate(${p[0]}%, ${p[1]}%) scale(${z})`;
    panAnim = pan.animate(
      [{ transform: t(a, z0) }, { transform: t(b, z1) }],
      { duration: SLIDE_MS + FADE_MS * 2, easing: 'ease-in-out', fill: 'forwards' }
    );
  }

  /* ---------- the show ---------- */
  const el = { title: $('plate-title'), text: $('plate-text'), link: $('plate-link'), photo: $('photo-text') };

  function present({ img, quote, caption }) {
    bg.style.backgroundImage = `url("${img.src}")`;
    if (gl) {
      try { uploadTexture(img); }
      catch (err) {   // e.g. file:// origin: image is "cross-origin" and can't be a texture
        console.warn('WebGL effect disabled, showing plain photo:', err.message);
        disableGL();
      }
    }
    const lbl = document.createElement('strong');
    lbl.textContent = 'Foto: ';
    el.photo.replaceChildren(lbl, caption);
    el.title.textContent = quote.title;
    el.text.textContent = quote.text;
    el.link.textContent = quote.link.label;
    el.link.href = quote.link.href;
    startPan();
    slideStart = performance.now();
    if (gl && !running) { running = true; requestAnimationFrame(frame); }
    stage.classList.add('in');
  }

  let skip = null;          // resolves the current wait early
  let nav = null;           // photo id requested via browser back/forward or an edited URL
  let currentId = null;
  let interacted = false;   // user activation (click/tap/key) – see history note in run()
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => { interacted = true; }, { capture: true, passive: true }));

  async function run() {
    initGL();
    addEventListener('resize', layoutGL);

    const startId = hashId();
    const startIdx = IMAGES.findIndex(i => i.id === startId);
    if (startIdx >= 0) deck = shuffle(IMAGES.map((_, i) => i).filter(i => i !== startIdx));   // linked photo opens the cycle
    let upcoming = prepareNext(startIdx >= 0 ? startId : null);
    let first = true;
    let pushed = 0;          // history entries built so far (capped at one full cycle)

    for (;;) {
      let slide, mode;
      if (nav) {                                    // history navigation: show that photo, don't add history
        const id = nav; nav = null;
        slide = await prepareNext(id);
        mode = slide && slide.id === id ? 'none' : 'replace';
      } else {
        slide = await upcoming;
        // Browsers skip history entries that a page adds before the user has interacted with it
        // (Back would jump straight off the site). So: only build history after a click/tap/key,
        // and only for one full cycle; otherwise just keep the URL current.
        const canPush = interacted && pushed < IMAGES.length;
        mode = first ? (slide && slide.id === startId ? 'none' : 'replace') : (canPush ? 'push' : 'replace');
        if (mode === 'push') pushed++;
        upcoming = prepareNext();                   // preload the next one while this one plays
      }
      first = false;
      if (!slide) { await sleep(5000); upcoming = prepareNext(); continue; }

      currentId = slide.id;
      setUrl(slide.id, mode);
      present(slide);
      if (!nav) await Promise.race([sleep(SLIDE_MS), new Promise(r => skip = r)]);
      skip = null;
      stage.classList.remove('in');
      await sleep(FADE_MS);
    }
  }

  addEventListener('keydown', e => { if (e.key === 'ArrowRight' && skip) skip(); });
  addEventListener('popstate', () => {              // back/forward buttons, or a hand-edited #hash
    const id = hashId();
    if (!isPhotoId(id) || id === currentId) return;
    nav = id;
    if (skip) skip();
  });

  run();
})();
</script>
</body>
</html>
